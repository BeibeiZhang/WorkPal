<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- iOS Safari status-bar tint — kills the seam between the system bar and the app shell.
         Hex values mirror --color-bg-page in src/index.css (light :root / dark .dark);
         App.tsx overrides the non-media meta on isDark toggle so in-app theme switches stay in sync. -->
    <meta name="theme-color" content="#F3F4F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#001424" media="(prefers-color-scheme: dark)" />
    <title>WorkPal</title>
    <meta name="description" content="WorkPal — your AI workplace assistant. Chat + tasks in the same project, voice-enabled rich input, selective knowledge output." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://workpal-beibei.vercel.app/" />
    <meta property="og:title" content="WorkPal — your AI workplace assistant" />
    <meta property="og:description" content="Chat + tasks in the same project, voice-enabled rich input, selective knowledge output." />
    <meta property="og:image" content="https://workpal-beibei.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WorkPal — your AI workplace assistant" />
    <meta name="twitter:description" content="Chat + tasks in the same project, voice-enabled rich input, selective knowledge output." />
    <meta name="twitter:image" content="https://workpal-beibei.vercel.app/og-image.jpg" />

    <!-- iOS Add to Home Screen -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WorkPal" />

    <!-- PWA manifest (Android Chrome + standalone iOS) -->
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
